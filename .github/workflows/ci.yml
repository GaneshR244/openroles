# Lint, typecheck, test and build both apps on every push and pull request.
name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openroles
          POSTGRES_PASSWORD: openroles_ci
          POSTGRES_DB: openroles_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openroles" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openroles:openroles_ci@localhost:5432/openroles_test?schema=public
      DATABASE_URL_TEST: postgresql://openroles:openroles_ci@localhost:5432/openroles_test?schema=public
      API_KEY: ci-api-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
